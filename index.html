<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Avaliação</title>
  <link rel="stylesheet" href="style.css">

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>Ficha de Avaliação</h1>

    <!-- Etapas -->
    <ul id="progress-steps">
      <li class="active">Informações Pessoais</li>
      <li>Rotina Diária</li>
      <li>Alimentação</li>
      <li>Saúde</li>
      <li>Exercícios</li>
      <li>Suplementos</li>
      <li>Finalizar</li>
    </ul>
    <div id="progress-bar"></div>

    <form id="multiStepForm">

      <!-- Etapa 1: Informações Pessoais -->
      <div class="form-step active">
        <h2>Informações Pessoais</h2>
        <label>Nome completo:<input type="text" id="nome" required></label>
        <label>Idade:<input type="number" id="idade" required></label>
        <label>Peso atual (kg):<input type="number" id="peso" required></label>
        <label>Altura (cm):<input type="number" id="altura" required></label>
        <label>Onde você mora?<input type="text" id="endereco" required></label>
        <label>Instagram (opcional)<input type="text" id="instagram"></label>
        <label>Objetivos:<textarea id="objetivos" required placeholder="Ex: perda de peso, ganho de massa, definição..."></textarea></label>
        <button type="button" class="next-btn">Avançar</button>
      </div>

      <!-- Etapa 2: Rotina Diária -->
      <div class="form-step">
        <h2>Rotina Diária</h2>
        <label>Horário que acorda:<input type="time" id="acorda"></label>
        <label>Horário de trabalho:
          <input type="time" id="trabalho_inicio" placeholder="Início">
          <input type="time" id="trabalho_fim" placeholder="Fim">
        </label>
        <label>Horário de treino:<input type="time" id="treino_horario"></label>
        <label>Horário de dormir:<input type="time" id="dorme"></label>
        <button type="button" class="prev-btn">Voltar</button>
        <button type="button" class="next-btn">Avançar</button>
      </div>

      <!-- Etapa 3: Alimentação -->
      <div class="form-step">
        <h2>Alimentação</h2>
        <div class="toggle-btns" data-field="restricao">
          <label>Tem restrição alimentar ou alergia?</label>
          <button type="button" data-value="sim">Sim</button>
          <button type="button" data-value="nao">Não</button>
          <input type="hidden" name="restricao_hidden">
        </div>
        <div class="conditional restricao hidden">
          <label>Qual?<input type="text" id="restricao_quais"></label>
        </div>
        <label>Cite alimentos que gostaria que fossem incluídos:<input type="text" id="incluir_alimentos"></label>
        <div class="toggle-btns" data-field="excluir">
          <label>Tem algum alimento que não quer que seja incluído?</label>
          <button type="button" data-value="sim">Sim</button>
          <button type="button" data-value="nao">Não</button>
          <input type="hidden" name="excluir_hidden">
        </div>
        <div class="conditional excluir hidden">
          <label>Qual?<input type="text" id="excluir_quais"></label>
        </div>
        <label>Frutas, legumes e verduras de preferência:<input type="text" id="preferencias_flv"></label>
        <label>Alimentação atual:<textarea id="alimentacao_atual"></textarea></label>
        <div class="toggle-btns" data-field="marmita">
          <label>Você tem possibilidade de levar marmita para o trabalho?</label>
          <button type="button" data-value="sim">Sim</button>
          <button type="button" data-value="nao">Não</button>
          <input type="hidden" name="marmita_hidden">
        </div>
        <button type="button" class="prev-btn">Voltar</button>
        <button type="button" class="next-btn">Avançar</button>
      </div>

      <!-- Etapa 4: Saúde -->
      <div class="form-step">
        <h2>Saúde</h2>
        <div class="toggle-btns" data-field="alergia">
          <label>Possui alguma alergia a alimentos ou medicamentos?</label>
          <button type="button" data-value="sim">Sim</button>
          <button type="button" data-value="nao">Não</button>
          <input type="hidden" name="alergia_hidden">
        </div>
        <div class="conditional alergia hidden">
          <label>Quais?<input type="text" id="alergia_quais"></label>
        </div>
        <div class="toggle-btns" data-field="doenca">
          <label>Possui alguma doença crônica?</label>
          <button type="button" data-value="sim">Sim</button>
          <button type="button" data-value="nao">Não</button>
          <input type="hidden" name="doenca_hidden">
        </div>
        <div class="conditional doenca hidden">
          <label>Quais?<input type="text" id="doenca_quais"></label>
        </div>
        <div class="toggle-btns" data-field="lesao">
          <label>Já sofreu alguma lesão?</label>
          <button type="button" data-value="sim">Sim</button>
          <button type="button" data-value="nao">Não</button>
          <input type="hidden" name="lesao_hidden">
        </div>
        <div class="conditional lesao hidden">
          <label>Qual?<input type="text" id="lesao_quais"></label>
        </div>
        <button type="button" class="prev-btn">Voltar</button>
        <button type="button" class="next-btn">Avançar</button>
      </div>

      <!-- Etapa 5: Exercícios -->
      <div class="form-step">
        <h2>Exercícios</h2>
        <div class="toggle-btns" data-field="aerobico">
          <label>Você realiza atividades aeróbicas?</label>
          <button type="button" data-value="sim">Sim</button>
          <button type="button" data-value="nao">Não</button>
          <input type="hidden" name="aerobico_hidden">
        </div>
        <div class="conditional aerobico hidden">
          <label>Em qual horário?<input type="time" id="aerobico_horario"></label>
        </div>
        <label>Quantas vezes na semana consegue treinar e fazer atividades aeróbicas?<input type="text" id="freq_treino"></label>
        <label>Tipo de treino / exercícios:<input type="text" id="tipo_treino"></label>
        <button type="button" class="prev-btn">Voltar</button>
        <button type="button" class="next-btn">Avançar</button>
      </div>

      <!-- Etapa 6: Suplementos e Protocolos -->
      <div class="form-step">
        <h2>Suplementos e Protocolos</h2>
        <div class="toggle-btns" data-field="suplemento">
          <label>Usa suplementos ou manipulados?</label>
          <button type="button" data-value="sim">Sim</button>
          <button type="button" data-value="nao">Não</button>
          <input type="hidden" name="suplemento_hidden">
        </div>
        <div class="conditional suplemento hidden">
          <label>Quais?<input type="text" id="suplemento_quais"></label>
        </div>
        <div class="toggle-btns" data-field="hormonal">
          <label>Está fazendo algum protocolo hormonal?</label>
          <button type="button" data-value="sim">Sim</button>
          <button type="button" data-value="nao">Não</button>
          <input type="hidden" name="hormonal_hidden">
        </div>
        <div class="conditional hormonal hidden">
          <label>Qual substância? Há quanto tempo e qual a dosagem?<input type="text" id="hormonal_quais"></label>
        </div>
        <button type="button" class="prev-btn">Voltar</button>
        <button type="button" class="next-btn">Avançar</button>
      </div>

      <!-- Etapa 7: Observações -->
      <div class="form-step">
        <h2>Observações</h2>
        <label>Outras observações:<textarea id="observacoes"></textarea></label>
        <button type="button" class="prev-btn">Voltar</button>
        <button type="submit" class="next-btn">Finalizar</button>
      </div>

    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
